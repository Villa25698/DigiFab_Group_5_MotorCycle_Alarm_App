name: mc_alarm
description: MC Alarm — rider hazard-detection companion app
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Pinned to versions that work with Flutter 3.24.5.
  # flutter_blue_plus 1.32.x onwards splits into platform packages built for
  # newer Gradle conventions; 1.31.x is the last monolithic-ish line that
  # still works on Flutter 3.24.
  flutter_blue_plus: 1.31.17
  permission_handler: 11.3.1
  flutter_local_notifications: 17.2.3
  provider: ^6.1.2
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

# Run `dart run flutter_launcher_icons` after editing this section to
# regenerate the launcher icons on every platform.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false                      # Android-focused build for now
  # Legacy launchers (pre-Android 8) use this directly.
  image_path: "assets/icon/icon.png"
  min_sdk_android: 23
  # Adaptive icon (Android 8+): black background, triangle on top with
  # built-in padding so the launcher's circular crop doesn't clip the
  # corners. icon_foreground.png is the padded version, generated from
  # icon.png with the triangle scaled to ~55% of the canvas.
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
