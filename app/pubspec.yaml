name: mc_alarm
description: MC Alarm — rider hazard-detection companion app
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Pinned to versions that work with Flutter 3.24.5.
  # flutter_blue_plus 1.32.x onwards splits into platform packages built for
  # newer Gradle conventions; 1.31.x is the last monolithic-ish line that
  # still works on Flutter 3.24.
  flutter_blue_plus: 1.31.17
  permission_handler: 11.3.1
  flutter_local_notifications: 17.2.3
  provider: ^6.1.2
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
